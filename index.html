<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>இலங்கை – ஊடாடும் இட வரைபடம்</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16245c; --teal:#0b8a8f; --violet:#6d3be0; --coral:#f0445b; --blue:#1769ff; --gold:#ffb703;
  --ink:#16245c; --muted:#5d6788;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink);
  font-family:'Noto Sans Tamil','Latha','Nirmala UI','Tamil Sangam MN','Tamil MN',system-ui,sans-serif;
  line-height:1.5;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,183,3,.20), transparent 38%),
    radial-gradient(circle at 92% 30%, rgba(109,59,224,.16), transparent 42%),
    radial-gradient(circle at 20% 85%, rgba(11,138,143,.18), transparent 40%),
    #f4f7ff;
  background-attachment:fixed;
}
/* ---------- sticky control bar ---------- */
.bar{
  position:sticky; top:0; z-index:30;
  background:linear-gradient(135deg,#16245c 0%,#3a2a9a 55%,#0b8a8f 100%);
  color:#fff; padding:10px 12px 12px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  box-shadow:0 6px 18px rgba(22,36,92,.35);
  border-bottom:3px solid var(--gold);
}
.bar-in{max-width:780px; margin:0 auto}
.title{margin:0; font-size:clamp(17px,4.6vw,24px); font-weight:800; text-align:center; letter-spacing:.2px}
.sub{margin:0 0 9px; text-align:center; font-size:clamp(11.5px,3vw,13.5px); color:rgba(255,255,255,.82)}
.tabs{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:9px}
.tab{
  border:0; padding:9px 4px; border-radius:12px; font:inherit; font-size:clamp(13px,3.5vw,15px); font-weight:700;
  color:#fff; background:rgba(255,255,255,.14); cursor:pointer; transition:transform .15s, background .2s, box-shadow .2s;
  display:flex; align-items:center; justify-content:center; gap:5px; white-space:nowrap;
}
.tab:hover{background:rgba(255,255,255,.24)}
.tab:active{transform:scale(.97)}
.tab .n{font-size:11px; font-weight:700; background:rgba(255,255,255,.25); border-radius:99px; padding:0 7px}
.tab[aria-selected="true"]{color:#fff; box-shadow:0 4px 12px rgba(0,0,0,.28)}
#tabPlaces[aria-selected="true"]{background:linear-gradient(135deg,#ff6b81,#f0445b)}
#tabRes[aria-selected="true"]{background:linear-gradient(135deg,#4aa3ff,#1769ff)}
#tabAll[aria-selected="true"]{background:linear-gradient(135deg,#9b6bff,#6d3be0)}
.pick{display:flex; gap:6px; align-items:stretch}
select{
  flex:1; min-width:0; padding:11px 10px; font:inherit; font-size:16px; font-weight:600; /* 16px stops iOS zoom */
  border-radius:12px; border:2px solid #fff; background:#fff; color:var(--ink);
}
.nav{
  width:46px; border:0; border-radius:12px; background:var(--gold); color:var(--navy);
  font-size:18px; font-weight:800; cursor:pointer; transition:transform .15s;
}
.nav:active{transform:scale(.94)}
/* ---------- map ---------- */
main{max-width:780px; margin:0 auto; padding:14px 10px 6px}
.map-wrap{
  position:relative; width:100%; overflow:hidden; border-radius:18px;
  background:linear-gradient(160deg,#fff7df 0%,#e9f6ff 100%);
  border:3px solid #fff; box-shadow:0 10px 28px rgba(22,36,92,.18), 0 0 0 1px rgba(22,36,92,.10);
}
.map-wrap img{display:block; width:100%; height:auto; mix-blend-mode:multiply; user-select:none; -webkit-user-drag:none}
#poly{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
#polyShape{fill:rgba(23,105,255,.6); stroke:#1769ff; stroke-width:1.5; vector-effect:non-scaling-stroke; animation:polyp 1.6s ease-in-out infinite}
@keyframes polyp{0%,100%{fill-opacity:.95}50%{fill-opacity:.35}}

.marker{position:absolute; width:0; height:0; pointer-events:none; z-index:5}
.marker[hidden]{display:none}
.dot{position:absolute; left:-2px; top:-2px; width:4px; height:4px; border-radius:50%; background:#ff0000; z-index:2}
.ring{
  position:absolute; left:-20px; top:-20px; width:40px; height:40px; border-radius:50%;
  border:2px solid rgba(240,68,91,.9); background:rgba(240,68,91,.14);
  transform:scale(.1); opacity:0; animation:pulse 2s ease-out infinite;
}
.ring.r2{animation-delay:1s}
@keyframes pulse{0%{transform:scale(.1);opacity:.95}100%{transform:scale(1);opacity:0}}
.marker.res .dot{display:none}
.marker.res .ring{border-color:rgba(23,105,255,.9); background:rgba(23,105,255,.14)}

/* soft, translucent name label */
.label{
  position:absolute; left:0; bottom:15px; white-space:nowrap; z-index:3;
  padding:3px 10px; border-radius:99px; font-weight:700; font-size:clamp(12px,3.4vw,15px);
  color:#a3162b; background:rgba(255,226,231,.70); border:1px solid rgba(240,68,91,.35);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); box-shadow:0 2px 8px rgba(22,36,92,.12);
}
.marker.res .label{color:#0b3fa8; background:rgba(221,235,255,.72); border-color:rgba(23,105,255,.38)}
.label::after{
  content:""; position:absolute; left:var(--ax,50%); bottom:-5px; margin-left:-5px;
  border:5px solid transparent; border-bottom:0; border-top-color:rgba(255,226,231,.85);
}
.marker.res .label::after{border-top-color:rgba(221,235,255,.88)}
.label.below{bottom:auto; top:15px}
.label.below::after{bottom:auto; top:-5px; border-top:0; border-bottom:5px solid rgba(255,226,231,.85)}
.marker.res .label.below::after{border-bottom-color:rgba(221,235,255,.88)}

.hint{
  text-align:center; color:var(--muted); font-size:13px; margin:12px auto 0; max-width:520px;
  background:rgba(255,255,255,.7); border-radius:99px; padding:6px 14px; border:1px dashed rgba(22,36,92,.2);
}
footer{
  margin-top:18px; text-align:center; color:#fff; font-weight:700; font-size:14px; letter-spacing:.3px;
  padding:14px 10px calc(16px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(135deg,#16245c,#3a2a9a 55%,#0b8a8f);
  border-top:3px solid var(--gold);
}
@media (prefers-reduced-motion:reduce){.ring,#polyShape{animation-duration:4s}}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-in">
    <h1 class="title">இலங்கை – ஊடாடும் இட வரைபடம்</h1>
    <p class="sub">இடத்தைத் தேர்ந்தெடுத்து வரைபடத்தில் காண்க</p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabPlaces" aria-selected="true">இடங்கள் <span class="n" id="nP"></span></button>
      <button class="tab" role="tab" id="tabRes" aria-selected="false">குளங்கள் <span class="n" id="nR"></span></button>
      <button class="tab" role="tab" id="tabAll" aria-selected="false">அனைத்தும் <span class="n" id="nA"></span></button>
    </div>
    <div class="pick">
      <button class="nav" id="prev" aria-label="முந்தையது">◀</button>
      <select id="sel" aria-label="இடத்தைத் தேர்ந்தெடுக்கவும்"></select>
      <button class="nav" id="next" aria-label="அடுத்தது">▶</button>
    </div>
  </div>
</header>

var sel=document.getElementById('sel'), wrap=document.getElementById('wrap'),
    marker=document.getElementById('marker'), label=document.getElementById('label'),
    poly=document.getElementById('polyShape'), bar=document.getElementById('bar'),
    tabs={places:document.getElementById('tabPlaces'), res:document.getElementById('tabRes'), all:document.getElementById('tabAll')};
var mode='places', current=null;

document.getElementById('nP').textContent=PLACES.length;
document.getElementById('nR').textContent=RES.length;
document.getElementById('nA').textContent=ALL.length;

// normalise every list to [name,x,y,polygon,type]
var LISTS={
  places:PLACES.map(function(p){return [p[0],p[1],p[2],p[3]||'',p[3]?'r':'p'];}),
  res:RES.map(function(r){return [r[0],r[1],r[2],r[3],'r'];}),
  all:ALL
};
function list(){ return LISTS[mode]; }

var PH={places:'இடத்தைத் தேர்ந்தெடுக்கவும்', res:'குளத்தைத் தேர்ந்தெடுக்கவும்', all:'தேர்ந்தெடுக்கவும்'};

function fillOptions(){
  var L=list();
  sel.innerHTML='<option value="">-- '+PH[mode]+' ('+L.length+') --</option>';
  for(var i=0;i<L.length;i++){
    var o=document.createElement('option');
    o.value=i; o.textContent=L[i][0];   // textContent => no encoding / markup issues
    sel.appendChild(o);
  }
}

function setMode(m){
  mode=m;
  for(var k in tabs) tabs[k].setAttribute('aria-selected', k===m);
  fillOptions(); clearMarker();
}

function clearMarker(){
  current=null; marker.hidden=true; poly.style.display='none'; poly.setAttribute('points','');
}

function placeLabel(){
  // keep the label inside the map frame; flip below the dot if there is no room above
  var ww=wrap.clientWidth, px=current.x/W*ww, py=current.y/H*wrap.clientHeight;
  label.classList.toggle('below', py<48);
  label.style.transform='translateX(-50%)';
  var lw=label.offsetWidth, shift=0, m=4;
  if(px-lw/2<m) shift=m-(px-lw/2);
  else if(px+lw/2>ww-m) shift=(ww-m)-(px+lw/2);
  label.style.transform='translateX(calc(-50% + '+shift+'px))';
  label.style.setProperty('--ax','calc(50% - '+shift+'px)');
}

function ensureVisible(){
  var d=marker.getBoundingClientRect(), vh=window.innerHeight, hb=bar.offsetHeight;
  if(d.top>hb+70 && d.top<vh-50) return;        // already comfortably in view
  var target=d.top+window.pageYOffset-(hb+(vh-hb)/2);
  window.scrollTo({top:Math.max(0,target), behavior:'smooth'});
}

function show(idx){
  var it=list()[idx]; if(!it) return clearMarker();
  current={x:it[1], y:it[2]};
  label.textContent=it[0];
  marker.style.left=(it[1]/W*100)+'%';
  marker.style.top=(it[2]/H*100)+'%';
  var isRes=(it[4]==='r');
  marker.classList.toggle('res', isRes);
  if(isRes){ poly.setAttribute('points', it[3]); poly.style.display=''; }
  else { poly.style.display='none'; }
  marker.hidden=false;
  placeLabel();
  requestAnimationFrame(ensureVisible);
}

sel.addEventListener('change', function(){
  if(sel.value==='') clearMarker(); else show(+sel.value);
});
function step(d){
  var i=sel.selectedIndex+d;
  if(i<1) i=1; if(i>=sel.options.length) i=sel.options.length-1;
  sel.selectedIndex=i; show(+sel.value);
}
